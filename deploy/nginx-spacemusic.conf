# Ejemplo de nginx delante de SpaceMusic (opcional, para HTTPS y dominio propio)
# sudo cp deploy/nginx-spacemusic.conf /etc/nginx/sites-available/spacemusic
# sudo ln -s /etc/nginx/sites-available/spacemusic /etc/nginx/sites-enabled/
# sudo certbot --nginx -d musica.tudominio.com     (certificado HTTPS gratis)
server {
    listen 80;
    server_name musica.tudominio.com;

    client_max_body_size 200m;      # subir canciones de hasta 200 MB

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;         # el audio empieza a sonar antes
        proxy_read_timeout 300s;
    }
}
