# App de iPhone activa: SwiftUI (ios/). Compila en una Mac de GitHub, ejecuta las pruebas y deja SpaceMusic.ipa sin firmar
# para instalar con Sideloadly. Corre al subir cambios dentro de ios/, en pull requests y a mano (Actions → "App iPhone").
name: App iPhone

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-swiftui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    name: SwiftUI · probar, compilar y crear IPA
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Probar modelos y letras
        run: swift test

      - name: Compilar (sin firmar)
        run: |
          set -o pipefail
          xcodebuild -project SpaceMusic.xcodeproj -scheme SpaceMusic \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || true
          grep -E "warning:|BUILD (SUCCEEDED|FAILED)" "$RUNNER_TEMP/build.log" | sort -u | tail -60 || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"

      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -80 || true
          tail -60 "$RUNNER_TEMP/build.log" || true

      - name: Crear SpaceMusic.ipa
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/SpaceMusic.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/SpaceMusic.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/SpaceMusic.ipa"

      # El servicio de artefactos de GitHub falla a veces de forma temporal (responde HTML en vez de JSON).
      - name: Guardar el .ipa
        id: publicar
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMusic-ipa
          path: SpaceMusic.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Esperar antes de reintentar
        if: steps.publicar.outcome == 'failure'
        run: sleep 90

      - name: Guardar el .ipa (reintento)
        if: steps.publicar.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMusic-ipa
          path: SpaceMusic.ipa
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Guardar registro si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SpaceMusic-registro-compilacion
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
