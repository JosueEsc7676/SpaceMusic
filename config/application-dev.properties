# =====================================================================
#  Perfil "dev": base de datos H2 local en ./data (no necesita MySQL)
#  Uso:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  (o en IntelliJ: Run > Edit Configurations > Active profiles: dev)
#  Está en config/ para que tenga prioridad sobre config/application.properties.
# =====================================================================
spring.datasource.url=jdbc:h2:file:./data/spacemusic-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,YEAR,MONTH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

music.path=./data/music
music.playlist-images-path=./data/uploads

# En desarrollo no se exige verificar el correo
app.require-email-verification=false
app.setup-key=dev-setup
