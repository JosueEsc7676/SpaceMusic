# =====================================================================
#  SPACEMUSIC — configuración base (sin contraseñas)
#
#  Los valores privados (BD, correo, JWT, rutas) van en
#  ./config/application.properties  (ver config/application.properties.example)
#  o en variables de entorno (DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET, ...).
# =====================================================================
spring.application.name=spacemusic
# Sin usuarios en memoria: la autenticación es con JWT
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=${PORT:8080}
# Detrás de un proxy (nginx, ngrok) usar la IP real del cliente
server.forward-headers-strategy=native

# Compresión de respuestas JSON/JS/CSS (el audio no se comprime)
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/javascript,text/css,text/html,image/svg+xml,application/manifest+json
server.compression.min-response-size=1024

# ===============================
# BASE DE DATOS
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/musicdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# ===============================
# MÚSICA Y ARCHIVOS
# ===============================
# Carpeta raíz donde está la música (se escanea recursivamente)
music.path=${MUSIC_PATH:./music}
# Carpeta para portadas de playlists, avatares y canciones subidas
music.playlist-images-path=${UPLOADS_PATH:./uploads}
# Minutos entre escaneos automáticos de la biblioteca
music.scan-interval-minutes=${SCAN_INTERVAL:10}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ===============================
# FRONTEND ESTÁTICO
# ===============================
spring.web.resources.static-locations=classpath:/static/
# Siempre comprobar si hay una versión nueva de la interfaz (respuesta 304 si no cambió).
# Evita que un navegador (p. ej. Safari en iPhone) use archivos viejos mezclados con nuevos.
spring.web.resources.cache.cachecontrol.no-cache=true
# Conexiones en vivo (mensajes y notificaciones) sin límite de tiempo
spring.mvc.async.request-timeout=-1
spring.thymeleaf.enabled=false

# ===============================
# SEGURIDAD
# ===============================
# Si se deja vacío se genera una clave aleatoria en cada arranque
# (los usuarios tendrían que volver a iniciar sesión tras reiniciar).
jwt.secret=${JWT_SECRET:}
# Duración de la sesión: 7 días
jwt.expiration=${JWT_EXPIRATION:604800000}
app.setup-key=${SETUP_KEY:}
# true = el usuario debe confirmar su correo antes de entrar
app.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:true}

# URL pública de la app (para los enlaces de los correos)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ===============================
# CORREO (Gmail con contraseña de aplicación)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8

# ===============================
# LOGS
# ===============================
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.jaudiotagger=ERROR
