# ===============================
# APP
# ===============================
spring.application.name=music

# ===============================
# BASE DE DATOS (MySQL en servidor)
# ===============================
spring.datasource.url=jdbc:mysql://192.168.10.170:3306/musicdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.url=jdbc:mysql://localhost:3306/musicdb
spring.datasource.username=barberuser
spring.datasource.password=***REMOVIDO***
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# RUTAS EN UBUNTU (IMPORTANTE)
# ===============================
#music.path=/home/joss200509/musica/music
music.path=P:/
#music.playlist-images-path=/home/joss200509/playlist-images
music.playlist-images-path=P:/playlist-images
# ===============================
# URL BASE (CAMBIA POR TU IP REAL)
# ===============================
music.base-url=http://192.168.10.18:8080

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# SUBIDA DE ARCHIVOS
# ===============================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


spring.web.resources.static-locations=classpath:/static/,classpath:/public/
spring.mvc.static-path-pattern=/**
spring.thymeleaf.enabled=false


# ===============================
# LOGS (OPCIONAL PARA DEBUG)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


