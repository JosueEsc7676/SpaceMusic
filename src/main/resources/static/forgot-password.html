<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Recuperar contraseña · SpaceMusic</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth-page.js" defer></script>
</head>
<body data-page="forgot">
<main class="card">
  <a class="brand" href="/login.html"><img src="/img/icon.svg" alt="">SpaceMusic</a>
  <h1>¿Olvidaste tu contraseña?</h1>
  <p class="sub">Te enviaremos un enlace para crear una nueva</p>
  <div id="msg" class="msg" role="alert"></div>
  <form id="form" novalidate>
    <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" autofocus required></div>
    <button class="btn" id="btn" type="submit">Enviar enlace</button>
  </form>
  <div class="links"><a href="/login.html">Volver a iniciar sesión</a></div>
</main>
</body>
</html>
