<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>SpaceMusic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-compact-disc"></i>
            <span>SpaceMusic</span>
        </div>

        <!-- Navegación principal -->
        <div class="nav">
            <div class="nav-item active" data-view="home">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </div>
            <div class="nav-item" data-view="favorites">
                <i class="fas fa-heart"></i>
                <span>Me gusta</span>
            </div>
            <div class="nav-item" data-view="library">
                <i class="fas fa-book"></i>
                <span>Tu biblioteca</span>
            </div>
            <div class="nav-item" data-view="artistas">
                <i class="fas fa-microphone"></i>
                <span>Artistas</span>
            </div>
            <div class="nav-item" data-view="estadisticas">
                <i class="fas fa-chart-bar"></i>
                <span>Estadísticas</span>
            </div>
        </div>

        <!-- Mix del día -->
        <div class="sidebar-mix" onclick="loadMixDiario()">
            <i class="fas fa-sun"></i>
            <span>Mix del día</span>
        </div>

        <!-- Playlists -->
        <div class="playlist-section">
            <div class="playlist-header">
                <span>MIS PLAYLISTS</span>
                <button class="create-playlist" onclick="openCreatePlaylistModal()" title="Nueva playlist">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div id="playlistList"></div>
        </div>
    </div>

    <!-- Contenido principal -->
    <div class="main" id="mainContent">
        <div class="top-bar">
            <div class="search-wrapper">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput"
                           placeholder="¿Qué quieres escuchar? Artistas, canciones, álbumes..."
                           autocomplete="off">
                    <div id="searchLoading" class="search-loading" style="display:none;">
                        <i class="fas fa-circle-notch animate-spin-custom"></i>
                    </div>
                </div>
                <div id="searchDropdown" class="search-dropdown" style="display:none;"></div>
            </div>

            <div class="search-filters" id="searchFilters">
                <button class="filter-btn active" data-filter="all">Todo</button>
                <button class="filter-btn" data-filter="canciones">Canciones</button>
                <button class="filter-btn" data-filter="albumes">Álbumes</button>
                <button class="filter-btn" data-filter="playlists">Playlists</button>
            </div>

            <div class="user-profile">
                <span>Usuario</span>
                <i class="fas fa-user-circle"></i>
            </div>
        </div>

        <div id="dynamicContent">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i><br>Cargando...
            </div>
        </div>
    </div>
</div>

<!-- Panel de cola -->
<div class="queue-panel" id="queuePanel">
    <div class="queue-header">
        <h3><i class="fas fa-list"></i> Cola de reproducción</h3>
        <button class="close-queue" onclick="toggleQueuePanel()">×</button>
    </div>
    <div class="queue-list" id="queueList">
        <div class="queue-empty">No hay canciones en cola</div>
    </div>
</div>

<!-- Reproductor global -->
<div class="global-player" id="globalPlayer">
    <div class="player-info">
        <img id="currentCover" src="https://singlecolorimage.com/get/1DB954/56x56"
             title="Ver ahora reproduciendo">
        <div class="player-text">
            <h4 id="currentSong">Selecciona una canción</h4>
            <p id="currentArtist">-</p>
        </div>
        <div class="player-actions">
            <i class="fas fa-heart favorite-btn" id="favoriteHeart"
               onclick="toggleCurrentFavorite()" title="Me gusta"></i>
            <i class="fas fa-music lyrics-btn" onclick="openLyricsModal()"
               title="Ver letra"></i>
            <i class="fas fa-list queue-toggle-btn" onclick="toggleQueuePanel()"
               title="Ver cola"></i>
        </div>
    </div>

    <div class="player-controls">
        <div class="control-buttons">
            <button class="control-btn shuffle-btn" onclick="toggleShuffle()" id="shuffleBtn"
                    title="Aleatorio"><i class="fas fa-random"></i></button>
            <button class="control-btn" onclick="prevSong()"
                    title="Anterior"><i class="fas fa-step-backward"></i></button>
            <button class="control-btn play-btn" onclick="togglePlayPause()">
                <i id="playPauseIcon" class="fas fa-play"></i>
            </button>
            <button class="control-btn" onclick="nextSong()"
                    title="Siguiente"><i class="fas fa-step-forward"></i></button>
            <button class="control-btn repeat-btn" onclick="toggleRepeatMode()" id="repeatBtn"
                    title="Repetir"><i class="fas fa-redo-alt"></i></button>
        </div>
        <div class="progress-container">
            <span class="time-current" id="currentTime">0:00</span>
            <div class="progress-bar-wrapper" id="progressBarWrapper">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressFill"></div>
                </div>
            </div>
            <span class="time-total" id="duration">0:00</span>
        </div>
    </div>

    <div class="volume-control">
        <i class="fas fa-volume-up" id="volumeIcon" onclick="toggleMute()"></i>
        <div class="volume-slider" id="volumeSlider">
            <div class="volume-fill" id="volumeFill"></div>
        </div>
    </div>
</div>

<audio id="audioElement"></audio>

<!-- Scripts — orden obligatorio -->
<script src="/js/auth.js"></script>
<script src="/js/general.js"></script>
<script src="/js/player.js"></script>
<script src="/js/radio.js"></script>

<script src="/js/debug_flac.js"></script>

<script src="/js/uiux.js"></script>
<script src="/js/lyrics_apple.js"></script>
<script src="/js/spotify_views.js"></script>
<script src="/js/enhancements.js"></script>
</body>
</html>
