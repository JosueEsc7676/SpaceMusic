<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>Nueva contraseña · SpaceMusic</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth-page.js" defer></script>
</head>
<body data-page="reset">
<main class="card">
  <a class="brand" href="/login.html"><img src="/img/icon.svg" alt="">SpaceMusic</a>
  <h1>Crea una nueva contraseña</h1>
  <p class="sub">Elige una contraseña que no uses en otros sitios</p>
  <div id="msg" class="msg" role="alert"></div>
  <form id="form" novalidate>
    <div class="field"><label for="password">Nueva contraseña</label><div class="pw"><input id="password" type="password" autocomplete="new-password" placeholder="" data-strength required><button type="button" aria-label="Mostrar contraseña">Ver</button></div><div class="strength"><i></i></div><div class="hint">Mínimo 8 caracteres, con letras y números.</div></div>
    <div class="field"><label for="password2">Repite la contraseña</label><div class="pw"><input id="password2" type="password" autocomplete="new-password" placeholder=""  required><button type="button" aria-label="Mostrar contraseña">Ver</button></div></div>
    <button class="btn" id="btn" type="submit">Guardar contraseña</button>
  </form>
  <div class="links"><a href="/login.html">Volver a iniciar sesión</a></div>
</main>
</body>
</html>
