<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceMusic — Nueva contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#111;border:1px solid #222;border-radius:20px;padding:44px 40px;width:100%;max-width:400px;}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:28px;}.logo i{font-size:26px;color:#1db954;}.logo span{font-size:20px;font-weight:800;}
h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:24px;}
.field{margin-bottom:14px;}label{display:block;font-size:11px;font-weight:600;color:#b3b3b3;margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase;}
input{width:100%;background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;font-family:inherit;transition:border .2s;}input:focus{outline:none;border-color:#1db954;}input::placeholder{color:#555;}
.btn{width:100%;background:#1db954;color:#000;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}.btn:hover{background:#1ed760;}.btn:disabled{background:#2a2a2a;color:#555;cursor:not-allowed;}
.msg{border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none;}
.error-msg{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);color:#e74c3c;}
.success-msg{background:rgba(29,185,84,.12);border:1px solid rgba(29,185,84,.3);color:#1db954;}
</style>
</head>
<body>
<div class="card">
    <div class="logo"><i class="fas fa-compact-disc"></i><span>SpaceMusic</span></div>
    <h1>Nueva contraseña</h1>
    <div class="error-msg msg" id="errorMsg"></div>
    <div class="success-msg msg" id="successMsg"></div>
    <div class="field"><label>Nueva contraseña</label><input type="password" id="pass" placeholder="Mínimo 8 caracteres"></div>
    <div class="field"><label>Confirmar contraseña</label><input type="password" id="confirm" placeholder="Repite la contraseña"></div>
    <button class="btn" id="btn" onclick="doReset()">Guardar contraseña</button>
</div>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) { document.getElementById('errorMsg').textContent='Token inválido.';document.getElementById('errorMsg').style.display='block';}
async function doReset(){
    const btn=document.getElementById('btn');
    const p=document.getElementById('pass').value,c=document.getElementById('confirm').value;
    if(p.length<8){document.getElementById('errorMsg').textContent='Mínimo 8 caracteres';document.getElementById('errorMsg').style.display='block';return;}
    if(p!==c){document.getElementById('errorMsg').textContent='Las contraseñas no coinciden';document.getElementById('errorMsg').style.display='block';return;}
    btn.disabled=true;btn.textContent='Guardando...';
    const res=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});
    const d=await res.json();
    if(d.error){document.getElementById('errorMsg').textContent=d.error;document.getElementById('errorMsg').style.display='block';btn.disabled=false;btn.textContent='Guardar contraseña';return;}
    document.getElementById('successMsg').textContent='✅ '+d.message;document.getElementById('successMsg').style.display='block';
    setTimeout(()=>location.href='/login.html?reset=true',2000);
}
</script>
</body>
</html>
