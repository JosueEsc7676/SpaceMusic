<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Crear cuenta · SpaceMusic</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@700;800&display=swap">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth-page.js" defer></script>
</head>
<body data-page="register">
<main class="card">
  <a class="brand" href="/login.html"><img src="/img/icon.svg" alt="">SpaceMusic</a>
  <h1>Crea tu cuenta</h1>
  <p class="sub">Es gratis y solo toma un minuto</p>
  <div id="msg" class="msg" role="alert"></div>
  <form id="form" novalidate>
    <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" autofocus required></div>
    <div class="field"><label for="username">Usuario</label><input id="username" type="text" autocomplete="username" placeholder="ej. maria.g" required maxlength="30"></div>
    <div class="field"><label for="nombre">Nombre visible</label><input id="nombre" type="text" autocomplete="name" placeholder="Cómo quieres que te llamen" maxlength="100"></div>
    <div class="field"><label for="password">Contraseña</label><div class="pw"><input id="password" type="password" autocomplete="new-password" placeholder="" data-strength required><button type="button" aria-label="Mostrar contraseña">Ver</button></div><div class="strength"><i></i></div><div class="hint">Mínimo 8 caracteres, con letras y números.</div></div>
    <div class="field"><label for="password2">Repite la contraseña</label><div class="pw"><input id="password2" type="password" autocomplete="new-password" placeholder=""  required><button type="button" aria-label="Mostrar contraseña">Ver</button></div></div>
    <button class="btn" id="btn" type="submit">Crear cuenta</button>
  </form>
  <div class="links">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></div>
</main>
</body>
</html>
