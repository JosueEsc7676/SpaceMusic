<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceMusic — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(29,185,84,.18) 0%,transparent 60%),radial-gradient(ellipse at 70% 20%,rgba(29,185,84,.08) 0%,transparent 50%);pointer-events:none;}
.card{background:#111;border:1px solid #222;border-radius:20px;padding:44px 40px;width:100%;max-width:420px;position:relative;z-index:1;}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:32px;}
.logo i{font-size:28px;color:#1db954;}
.logo span{font-size:22px;font-weight:800;letter-spacing:-.5px;}
h1{font-size:24px;font-weight:700;text-align:center;margin-bottom:6px;}
.sub{color:#b3b3b3;font-size:14px;text-align:center;margin-bottom:28px;}
.field{margin-bottom:16px;}
label{display:block;font-size:12px;font-weight:600;color:#b3b3b3;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;}
input{width:100%;background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;font-family:inherit;transition:border .2s;}
input:focus{outline:none;border-color:#1db954;}
input::placeholder{color:#555;}
.btn{width:100%;background:#1db954;color:#000;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s,transform .15s;}
.btn:hover{background:#1ed760;transform:scale(1.01);}
.btn:active{transform:scale(.98);}
.btn:disabled{background:#2a2a2a;color:#555;cursor:not-allowed;transform:none;}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#444;font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#222;}
.link-row{text-align:center;font-size:13px;color:#b3b3b3;margin-top:16px;}
.link-row a{color:#1db954;text-decoration:none;font-weight:500;}
.link-row a:hover{text-decoration:underline;}
.error-msg{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);border-radius:8px;padding:10px 12px;font-size:13px;color:#e74c3c;margin-bottom:14px;display:none;}
.success-msg{background:rgba(29,185,84,.12);border:1px solid rgba(29,185,84,.3);border-radius:8px;padding:10px 12px;font-size:13px;color:#1db954;margin-bottom:14px;display:none;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
.forgot{display:block;text-align:right;font-size:12px;color:#b3b3b3;margin-top:4px;}
.forgot:hover{color:#1db954;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
    <div class="logo">
        <i class="fas fa-compact-disc"></i>
        <span>SpaceMusic</span>
    </div>
    <h1>Bienvenido de vuelta</h1>
    <p class="sub">Inicia sesión para continuar</p>

    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>

    <div class="field">
        <label>Correo o usuario</label>
        <input type="text" id="email" placeholder="tu@correo.com" autocomplete="username">
    </div>
    <div class="field">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password">
        <a href="/forgot-password.html" class="forgot">¿Olvidaste tu contraseña?</a>
    </div>

    <button class="btn" id="loginBtn" onclick="doLogin()">Iniciar sesión</button>

    <div class="link-row" style="margin-top:20px">
        ¿No tienes cuenta? <a href="/register.html">Regístrate gratis</a>
    </div>
</div>

<script>
// Mostrar mensaje si viene de verificación exitosa
const params = new URLSearchParams(location.search);
if (params.get('verified') === 'true') {
    document.getElementById('successMsg').textContent = '✅ Email verificado. Ya puedes iniciar sesión.';
    document.getElementById('successMsg').style.display = 'block';
}
if (params.get('reset') === 'true') {
    document.getElementById('successMsg').textContent = '✅ Contraseña actualizada. Inicia sesión.';
    document.getElementById('successMsg').style.display = 'block';
}

document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});

async function doLogin() {
    const btn   = document.getElementById('loginBtn');
    const errEl = document.getElementById('errorMsg');
    const email = document.getElementById('email').value.trim();
    const pass  = document.getElementById('password').value;

    errEl.style.display = 'none';

    if (!email || !pass) {
        errEl.textContent = 'Completa todos los campos';
        errEl.style.display = 'block';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Entrando...';

    try {
        const res  = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();

        if (data.error) {
            errEl.textContent = data.error;
            errEl.style.display = 'block';
            return;
        }

        // Guardar token y datos del usuario
        localStorage.setItem('sm_token', data.token);
        localStorage.setItem('sm_user',  JSON.stringify(data.usuario));

        // Redirigir a la app
        location.href = '/index.html';

    } catch(e) {
        errEl.textContent = 'Error de conexión. Intenta de nuevo.';
        errEl.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Iniciar sesión';
    }
}
</script>
</body>
</html>
