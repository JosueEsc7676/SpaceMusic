<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>Iniciar sesión · SpaceMusic</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth-page.js" defer></script>
</head>
<body data-page="login">
<main class="card">
  <a class="brand" href="/login.html"><img src="/img/icon.svg" alt="">SpaceMusic</a>
  <h1>Te damos la bienvenida</h1>
  <p class="sub">Inicia sesión para escuchar tu música</p>
  <div id="msg" class="msg" role="alert"></div>
  <form id="form" novalidate>
    <div class="field"><label for="usuario">Correo o usuario</label><input id="usuario" type="text" autocomplete="username" placeholder="tu@correo.com" autofocus required></div>
    <div class="field"><label for="password">Contraseña</label><div class="pw"><input id="password" type="password" autocomplete="current-password" placeholder=""  required><button type="button" aria-label="Mostrar contraseña">Ver</button></div></div>
    <div class="right"><a href="/forgot-password.html">¿Olvidaste tu contraseña?</a></div>
    <button class="btn" id="btn" type="submit">Iniciar sesión</button>
  </form>
  <div class="links">¿No tienes cuenta? <a href="/register.html">Regístrate</a></div>
  <div class="setup-banner" id="setupBanner">Primera vez: <a href="/setup.html">crea la cuenta de administrador</a></div>
</main>
</body>
</html>
