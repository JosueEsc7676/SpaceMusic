<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>Instalación · SpaceMusic</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/auth-page.js" defer></script>
</head>
<body data-page="setup">
<main class="card">
  <a class="brand" href="/login.html"><img src="/img/icon.svg" alt="">SpaceMusic</a>
  <h1>Configura SpaceMusic</h1>
  <p class="sub">Crea la cuenta de administrador</p>
  <div id="msg" class="msg" role="alert"></div>
  <form id="form" novalidate>
    <div class="field" id="keyField"><label for="key">Clave de instalación</label><input id="key" type="password" autocomplete="off" placeholder="app.setup-key del servidor"><div class="hint" id="keyHint">Es el valor de app.setup-key en la configuración del servidor.</div></div>
    <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" placeholder="admin@correo.com" required></div>
    <div class="field"><label for="username">Usuario</label><input id="username" type="text" autocomplete="username" placeholder="admin" required maxlength="30"></div>
    <div class="field"><label for="nombre">Nombre visible</label><input id="nombre" type="text" autocomplete="name" placeholder="Administrador" maxlength="100"></div>
    <div class="field"><label for="password">Contraseña</label><div class="pw"><input id="password" type="password" autocomplete="new-password" placeholder="" data-strength required><button type="button" aria-label="Mostrar contraseña">Ver</button></div><div class="strength"><i></i></div><div class="hint">Mínimo 8 caracteres, con letras y números.</div></div>
    <button class="btn" id="btn" type="submit">Crear administrador</button>
  </form>
  <div class="links"><a href="/login.html">Volver a iniciar sesión</a></div>
</main>
</body>
</html>
